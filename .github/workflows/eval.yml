name: DocMind Retrieval & Faithfulness CI Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Next.js Build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'dummy_key' }}
        run: npm run build

      - name: Check Database & Groq Secrets
        id: check_secrets
        run: |
          if [ -n "${{ secrets.DATABASE_URL }}" ] && [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "Repository secrets found. Running live evaluation suite."
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "::notice title=Missing Secrets::DATABASE_URL or GROQ_API_KEY secret not found. To enable automated RAG evaluations, add DATABASE_URL and GROQ_API_KEY in Repository Settings > Secrets and variables > Actions."
          fi

      - name: Run Schema Migration & Seed
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/migrate.ts
          npx tsx scripts/seed.ts

      - name: Run RAG Evaluation Harness
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run eval

      - name: Upload Eval Report Artifact
        if: steps.check_secrets.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: eval/results/*.md
