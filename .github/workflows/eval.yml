name: DocMind Retrieval & Faithfulness CI Eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evaluate-rag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Schema Migration & Seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          npx tsx scripts/migrate.ts
          npx tsx scripts/seed.ts

      - name: Run RAG Evaluation Harness
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: npm run eval

      - name: Upload Eval Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: eval/results/*.md
